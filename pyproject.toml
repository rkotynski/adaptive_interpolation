[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-interpolation-sampling"
version = "1.0.0"
description = "Adaptive one-dimensional sampling with interpolation disagreement, MATLAB/Octave and Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Andrzej Janaszek"}, {name = "Piotr Wróbel"}, {name = "Maciej Dems"}, {name = "Omer Ceylan"}, {name = "Yasar Gurbuz"}, {name = "Łukasz Kubiszyn"}, {name = "Józef Piotrowski"}, {name = "Rafał Kotyński"}]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
demo = ["matplotlib>=3.6", "pillow>=9"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
